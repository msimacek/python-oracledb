[tox]
envlist = py{36,37,38,39,310}-{thin,thick}

[testenv]
commands = {envpython} -m unittest discover -v -s tests
passenv =
    PY_ORACLEDB_TEST_MAIN_USER
    PY_ORACLEDB_TEST_MAIN_PASSWORD
    PY_ORACLEDB_TEST_PROXY_USER
    PY_ORACLEDB_TEST_PROXY_PASSWORD
    PY_ORACLEDB_TEST_CONNECT_STRING
    PY_ORACLEDB_TEST_ADMIN_USER
    PY_ORACLEDB_TEST_ADMIN_PASSWORD
    DPI_DEBUG_LEVEL
    ORACLE_HOME

[testenv:py{36,37,38,39,310}-thick]
setenv =
    PY_ORACLEDB_TEST_DRIVER_TYPE=thick

[testenv:py{36,37,38,39,310}-thin]
setenv =
    PY_ORACLEDB_TEST_DRIVER_TYPE=thin
